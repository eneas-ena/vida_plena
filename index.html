<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VidaPlena</title>
<meta name="description" content="VidaPlena — Produtividade e Ministério">
<meta name="theme-color" content="#0F1B33">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="favicon-32.png" type="image/png" sizes="32x32">
<link rel="icon" href="icon-192.png" type="image/png" sizes="192x192">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/lucide@0.460.0/dist/umd/lucide.min.js"></script>
<style>
/* ================= TOKENS ================= */
:root{
  --navy:#0F1B33; --navy-2:#18284A; --gold:#C9A227; --gold-2:#E3C55A; --gold-soft:#F6EBC6;
  --bg:#F4F2EC; --surface:#FFFFFF; --surface-2:#F8F7F3; --line:#E6E2D8; --line-2:#EFECE4;
  --text:#1B2233; --muted:#667085; --faint:#98A2B3;
  --ok:#2E7D4F; --ok-bg:#E3F3E8; --warn:#B26A00; --warn-bg:#FFF1D6; --bad:#B4232A; --bad-bg:#FDE4E4; --info:#2457A6; --info-bg:#E2ECFB;
  --shadow:0 1px 2px rgba(15,27,51,.06),0 4px 14px rgba(15,27,51,.06);
  --shadow-lg:0 10px 40px rgba(15,27,51,.18);
  --r:16px; --r-sm:10px;
  /* post-its */
  --p-amarelo:#FCE588; --p-azul:#A9D8F7; --p-rosa:#F8B4D3; --p-lilas:#D7BCF5; --p-verde:#C6EB8E; --p-laranja:#FBC387;
  --p-ink:#1E2433;
  --font-ui:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;
  --font-title:'Cinzel',Georgia,serif;
  --font-read:'Cormorant Garamond',Georgia,serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0A1222; --surface:#121D33; --surface-2:#0F182B; --line:#22304C; --line-2:#1A2740;
    --text:#E8ECF4; --muted:#A3AEC4; --faint:#6F7C96; --gold-soft:#3A3115;
    --ok-bg:#163525; --warn-bg:#3A2A0C; --bad-bg:#3D1719; --info-bg:#17294A; --ok:#7FD3A0; --warn:#F2B654; --bad:#F2878C; --info:#8DB5F5;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 14px rgba(0,0,0,.25);
    --p-amarelo:#E8CF6A; --p-azul:#8EC2E6; --p-rosa:#E59BBE; --p-lilas:#BFA2E2; --p-verde:#A9D06F; --p-laranja:#E9A967;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0A1222; --surface:#121D33; --surface-2:#0F182B; --line:#22304C; --line-2:#1A2740;
  --text:#E8ECF4; --muted:#A3AEC4; --faint:#6F7C96; --gold-soft:#3A3115;
  --ok-bg:#163525; --warn-bg:#3A2A0C; --bad-bg:#3D1719; --info-bg:#17294A; --ok:#7FD3A0; --warn:#F2B654; --bad:#F2878C; --info:#8DB5F5;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 14px rgba(0,0,0,.25);
  --p-amarelo:#E8CF6A; --p-azul:#8EC2E6; --p-rosa:#E59BBE; --p-lilas:#BFA2E2; --p-verde:#A9D06F; --p-laranja:#E9A967;
  color-scheme:dark;
}

/* ================= BASE ================= */
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--text);font-family:var(--font-ui);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:inherit}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px;border-radius:6px}
[data-lucide]{width:18px;height:18px;stroke-width:2;flex:none}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.hidden{display:none!important}

/* ================= SHELL ================= */
.app{display:grid;grid-template-columns:96px 1fr;grid-template-rows:72px 1fr;min-height:100vh;background:linear-gradient(to right,var(--navy-2) 96px,transparent 96px)}
.topbar{grid-column:1/-1;display:flex;align-items:center;gap:20px;padding:0 24px;background:var(--navy);color:#fff;position:sticky;top:0;z-index:20}
.brand{display:flex;align-items:center;gap:12px;min-width:240px;text-decoration:none}
.brand-mark{width:44px;height:44px;display:block}
.brand-name{font-family:var(--font-title);font-weight:700;font-size:22px;letter-spacing:.04em;color:#fff;line-height:1}
.brand-sub{font-size:12px;color:var(--gold-2);letter-spacing:.06em;margin-top:3px}
.search{flex:1;max-width:520px;position:relative}
.search input{width:100%;height:40px;border-radius:999px;border:1px solid rgba(255,255,255,.14);background:rgba(255,255,255,.08);color:#fff;padding:0 16px 0 42px;outline:none}
.search input::placeholder{color:rgba(255,255,255,.55)}
.search input:focus{border-color:var(--gold)}
.search [data-lucide]{position:absolute;left:14px;top:11px;color:rgba(255,255,255,.6)}
.top-right{margin-left:auto;display:flex;align-items:center;gap:12px}
.icon-btn{width:40px;height:40px;border-radius:12px;border:1px solid rgba(255,255,255,.14);background:rgba(255,255,255,.06);color:#fff;display:grid;place-items:center}
.icon-btn:hover{border-color:var(--gold);color:var(--gold-2)}
.version{font-size:11px;font-weight:600;color:var(--navy);background:var(--gold);padding:3px 8px;border-radius:999px;letter-spacing:.04em}
.hello{display:flex;align-items:center;gap:10px;padding-left:6px}
.avatar{width:38px;height:38px;border-radius:50%;background:linear-gradient(135deg,var(--gold),#8E6F12);display:grid;place-items:center;font-family:var(--font-title);font-weight:700;color:var(--navy)}
.hello b{display:block;font-size:14px}
.hello span{font-size:12px;color:rgba(255,255,255,.7)}

.side{background:var(--navy-2);padding:14px 10px;display:flex;flex-direction:column;gap:4px;position:sticky;top:72px;height:calc(100vh - 72px)}
.nav{display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 4px;border-radius:14px;color:rgba(255,255,255,.72);text-decoration:none;font-size:11.5px;font-weight:500;border:1px solid transparent;position:relative}
.nav [data-lucide]{width:22px;height:22px}
.nav:hover{color:#fff;background:rgba(255,255,255,.06)}
.nav.active{color:var(--navy);background:var(--gold)}
.nav .soon{position:absolute;top:4px;right:6px;font-size:8.5px;background:rgba(255,255,255,.14);color:#fff;padding:1px 4px;border-radius:5px}
.nav.active .soon{background:var(--navy);color:var(--gold-2)}
.side .spacer{flex:1}

.main{padding:24px;min-width:0}
.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:18px;flex-wrap:wrap}
.page-title{display:flex;align-items:center;gap:14px}
.page-icon{width:46px;height:46px;border-radius:14px;background:var(--navy);color:var(--gold);display:grid;place-items:center}
.page-icon [data-lucide]{width:24px;height:24px}
h1{font-family:var(--font-title);font-size:26px;font-weight:600;margin:0;letter-spacing:.01em}
.page-sub{color:var(--muted);margin:2px 0 0;font-size:14px}

.grid-dash{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:20px;align-items:start}
.card{background:var(--surface);border:1px solid var(--line-2);border-radius:var(--r);box-shadow:var(--shadow);padding:18px 20px}
.card h2{font-size:16px;margin:0;font-weight:650;display:flex;align-items:center;gap:8px}
.card h2 [data-lucide]{color:var(--gold)}
.card-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
.link{background:none;border:0;padding:0;color:var(--info);font-size:13px;font-weight:600}
.stack{display:flex;flex-direction:column;gap:16px}
.muted{color:var(--muted)}
.small{font-size:13px}
.empty{color:var(--muted);font-size:13.5px;padding:10px 12px;border:1px dashed var(--line);border-radius:var(--r-sm);background:var(--surface-2)}
.tag-phase{display:inline-block;font-size:11px;font-weight:600;color:var(--warn);background:var(--warn-bg);padding:2px 8px;border-radius:999px}

/* ================= BUTTONS / FORMS ================= */
.btn{display:inline-flex;align-items:center;gap:8px;height:40px;padding:0 16px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-weight:600;font-size:14px}
.btn:hover{border-color:var(--gold)}
a.btn{text-decoration:none;color:inherit}
.btn.primary{background:var(--navy);border-color:var(--navy);color:#fff}
.btn.primary [data-lucide]{color:var(--gold)}
.btn.primary:hover{background:#1B2C52}
.btn.gold{background:var(--gold);border-color:var(--gold);color:var(--navy)}
.btn.danger{color:var(--bad)}
.btn.sm{height:32px;padding:0 10px;font-size:13px;border-radius:9px}
.btn:disabled{opacity:.55;cursor:not-allowed}
label.f{display:block;font-size:13px;font-weight:600;margin-bottom:6px}
label.f .req{color:var(--bad)}
.inp,select.inp,textarea.inp{width:100%;height:42px;border:1px solid var(--line);border-radius:11px;background:var(--surface);padding:0 12px;outline:none}
textarea.inp{height:auto;min-height:84px;padding:10px 12px;resize:vertical}
.inp:focus{border-color:var(--gold);box-shadow:0 0 0 3px rgba(201,162,39,.18)}
.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
.field{margin-bottom:14px}
.hint{font-size:12px;color:var(--faint);margin-top:4px}
.seg{display:flex;gap:8px;flex-wrap:wrap}
.seg button{flex:1;min-width:90px;height:40px;border-radius:11px;border:1px solid var(--line);background:var(--surface);font-weight:600;font-size:13.5px;display:flex;align-items:center;justify-content:center;gap:6px}
.seg button[aria-pressed="true"]{border-color:var(--navy);background:var(--navy);color:#fff}
.seg button[aria-pressed="true"] [data-lucide]{color:var(--gold)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{height:34px;min-width:42px;padding:0 10px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-size:13px;font-weight:600}
.chip[aria-pressed="true"]{background:var(--gold);border-color:var(--gold);color:var(--navy)}
.swatches{display:flex;gap:8px}
.sw{width:34px;height:34px;border-radius:10px;border:2px solid transparent;box-shadow:inset 0 0 0 1px rgba(0,0,0,.08)}
.sw[aria-pressed="true"]{border-color:var(--navy);transform:scale(1.08)}
:root[data-theme="dark"] .sw[aria-pressed="true"]{border-color:#fff}
.check{display:flex;align-items:center;gap:8px;font-size:14px}
.check input{width:18px;height:18px;accent-color:var(--navy)}

/* ================= POST-ITS ================= */
.mural-sec{margin-bottom:22px}
.mural-head{display:flex;align-items:center;gap:8px 12px;margin-bottom:12px;flex-wrap:wrap}
.mural-head h3{font-family:var(--font-title);font-size:22px;margin:0;font-weight:600}
.mural-head .date{color:var(--muted);font-size:14px}
.mural-head .count{margin-left:auto;font-size:13px;color:var(--muted);background:var(--surface-2);border:1px solid var(--line);padding:4px 12px;border-radius:999px}
.mural-head .sun{color:#E2A400}
.mural-head .cal{color:var(--info)}
.postits{display:grid;grid-template-columns:repeat(auto-fill,minmax(205px,1fr));gap:18px}
.postit{--pc:var(--p-amarelo);background:var(--pc);color:var(--p-ink);border-radius:6px 6px 14px 6px;padding:14px 14px 12px;min-height:150px;position:relative;box-shadow:0 2px 0 rgba(0,0,0,.04),0 10px 18px -8px rgba(15,27,51,.35);display:flex;flex-direction:column;gap:8px;transition:transform .15s ease,box-shadow .15s ease}
.postit::after{content:"";position:absolute;right:0;bottom:0;width:22px;height:22px;background:linear-gradient(135deg,transparent 50%,rgba(0,0,0,.08) 50%);border-radius:0 0 14px 0}
.postits .postit:nth-child(3n+1){transform:rotate(-.5deg)}
.postits .postit:nth-child(3n+2){transform:rotate(.4deg)}
.postit:hover{transform:translateY(-2px) rotate(0)!important;box-shadow:0 2px 0 rgba(0,0,0,.04),0 16px 24px -10px rgba(15,27,51,.45)}
.postit.done{opacity:.62}
.postit.done .pt-title{text-decoration:line-through}
.pt-top{display:flex;align-items:flex-start;gap:10px}
.pt-check{width:22px;height:22px;border-radius:6px;border:2px solid rgba(30,36,51,.55);background:rgba(255,255,255,.55);display:grid;place-items:center;flex:none;margin-top:1px;padding:0}
.pt-check [data-lucide]{width:15px;height:15px;stroke-width:3;opacity:0}
.postit.done .pt-check{background:var(--p-ink);border-color:var(--p-ink);color:#fff}
.postit.done .pt-check [data-lucide]{opacity:1}
.pt-title{font-weight:650;font-size:15.5px;line-height:1.3;flex:1;word-break:break-word}
.pt-menu{background:none;border:0;padding:2px;color:rgba(30,36,51,.6);border-radius:6px}
.pt-menu:hover{background:rgba(255,255,255,.4)}
.pt-pin{color:#B4232A}
.pt-badges{display:flex;gap:6px;flex-wrap:wrap;margin-left:32px}
.pt-badge{font-size:11.5px;font-weight:600;padding:2px 8px;border-radius:999px;background:rgba(255,255,255,.55)}
.pt-badge.auto{background:rgba(30,36,51,.85);color:#fff}
.pt-badge.alta{background:#B4232A;color:#fff}
.pt-badge.venc{background:#7A1A1F;color:#fff}
.pt-foot{margin-top:auto;display:flex;align-items:center;gap:8px;font-size:13.5px;font-weight:500;margin-left:32px}
.pt-foot [data-lucide]{width:16px;height:16px;opacity:.75}
.c-amarelo{--pc:var(--p-amarelo)} .c-azul{--pc:var(--p-azul)} .c-rosa{--pc:var(--p-rosa)} .c-lilas{--pc:var(--p-lilas)} .c-verde{--pc:var(--p-verde)} .c-laranja{--pc:var(--p-laranja)}
.bg-amarelo{background:var(--p-amarelo)} .bg-azul{background:var(--p-azul)} .bg-rosa{background:var(--p-rosa)} .bg-lilas{background:var(--p-lilas)} .bg-verde{background:var(--p-verde)} .bg-laranja{background:var(--p-laranja)}
.add-postit{border:2px dashed var(--line);border-radius:14px;min-height:150px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;color:var(--muted);background:transparent;font-weight:600}
.add-postit:hover{border-color:var(--gold);color:var(--text)}
.overdue{background:var(--bad-bg);border:1px solid rgba(180,35,42,.18);border-radius:var(--r);padding:12px 16px;margin-bottom:20px}
.overdue h4{margin:0 0 8px;font-size:14px;color:var(--bad);display:flex;align-items:center;gap:8px}
.od-item{display:flex;align-items:center;gap:8px 10px;flex-wrap:wrap;padding:6px 0;border-top:1px solid rgba(180,35,42,.12);font-size:14px}
.od-item:first-of-type{border-top:0}
.od-item .grow{flex:1}
.dot{width:10px;height:10px;border-radius:50%;flex:none}

/* ================= INFO PANEL ================= */
.dayinfo .big{font-family:var(--font-title);font-size:19px;font-weight:600;margin:4px 0 6px}
.verse{font-family:var(--font-read);font-size:18px;line-height:1.35;font-style:italic;color:var(--text)}
.verse small{font-family:var(--font-ui);font-style:normal;font-size:12.5px;color:var(--muted);font-weight:600;margin-left:4px}
.duo{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.mini h2{font-size:15px}
.list-rows{display:flex;flex-direction:column}
.lr{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line-2);font-size:14px}
.lr:first-child{border-top:0}
.lr .d{width:46px;color:var(--muted);font-variant-numeric:tabular-nums;font-size:13px}
.dev-mini h3{font-family:var(--font-title);font-size:15.5px;margin:0 0 2px;font-weight:600}
.dev-mini .ref{font-size:12.5px;color:var(--gold);font-weight:700;letter-spacing:.03em}
.dev-mini p{font-family:var(--font-read);font-size:16.5px;line-height:1.4;margin:6px 0 0;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
.sug-duo{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sug{border-radius:12px;padding:12px;font-size:13px}
.sug b{display:flex;gap:6px;align-items:center;font-size:13.5px;margin-bottom:4px}
.sug.s1{background:#FFF0E2;color:#5A3510} .sug.s2{background:#E4F6EC;color:#174A2E}
:root[data-theme="dark"] .sug.s1{background:#3A2614;color:#F8D6B4} :root[data-theme="dark"] .sug.s2{background:#14321F;color:#BDEBCF}

/* ================= TASKS PAGE ================= */
.grid-tasks{display:grid;grid-template-columns:420px minmax(0,1fr);gap:20px;align-items:start}
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.pill{height:34px;padding:0 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-weight:600;font-size:13px;display:inline-flex;align-items:center;gap:6px}
.pill[aria-pressed="true"]{background:var(--info-bg);border-color:var(--info);color:var(--info)}
.pill .n{opacity:.7;font-weight:500}
.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th{font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:600;text-align:left;padding:8px;border-bottom:1px solid var(--line)}
.tbl td{padding:10px 8px;border-bottom:1px solid var(--line-2);vertical-align:middle}
.tbl tr:hover td{background:var(--surface-2)}
.badge{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:600;padding:2px 9px;border-radius:999px;white-space:nowrap}
.b-info{background:var(--info-bg);color:var(--info)} .b-ok{background:var(--ok-bg);color:var(--ok)} .b-warn{background:var(--warn-bg);color:var(--warn)} .b-bad{background:var(--bad-bg);color:var(--bad)} .b-mut{background:var(--surface-2);color:var(--muted);border:1px solid var(--line)}
.act{display:flex;gap:4px;justify-content:flex-end}
.act button{width:32px;height:32px;border-radius:9px;border:1px solid transparent;background:none;color:var(--muted);display:grid;place-items:center}
.act button:hover{border-color:var(--line);color:var(--text);background:var(--surface)}
.preview-wrap{display:grid;grid-template-columns:1fr;gap:12px;margin-top:6px}
.preview-wrap .postit{max-width:260px}
.tip{display:flex;gap:10px;align-items:flex-start;background:var(--gold-soft);border-radius:var(--r);padding:12px 16px;font-size:13.5px;max-width:420px}
.tip [data-lucide]{color:var(--gold)}

/* ================= AGENDA ================= */
.grid-agenda{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:20px;align-items:start}
.cal-bar{display:flex;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.cal-bar h2{font-family:var(--font-title);font-size:22px;font-weight:600;margin:0 8px;min-width:200px}
.month{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border:1px solid var(--line);border-radius:14px;overflow:hidden}
.month .wd{background:var(--surface-2);text-align:center;font-size:12.5px;font-weight:600;color:var(--muted);padding:8px 0;border-bottom:1px solid var(--line)}
.day{min-height:112px;padding:6px;border-right:1px solid var(--line-2);border-bottom:1px solid var(--line-2);background:var(--surface);text-align:left;border-top:0;border-left:0;display:flex;flex-direction:column;gap:4px;font-size:12px}
.day:nth-child(7n+7){border-right:0}
.day.out{background:var(--surface-2);color:var(--faint)}
.day.sel{box-shadow:inset 0 0 0 2px var(--gold)}
.day .n{font-weight:600;font-size:13px;width:26px;height:26px;display:grid;place-items:center;border-radius:50%}
.day.today .n{background:var(--navy);color:#fff}
.ev{display:block;width:100%;border-radius:6px;padding:3px 6px;color:var(--p-ink);font-size:11.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ev.feito{opacity:.55;text-decoration:line-through}
.more{font-size:11px;color:var(--muted);font-weight:600;padding-left:4px}
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:10px}
.wcol{background:var(--surface);border:1px solid var(--line-2);border-radius:12px;padding:8px;min-height:300px;display:flex;flex-direction:column;gap:6px}

// <motor> ===== Motor de datas e ocorrências (testado em testes.html) =====
const JANELA_ATRASO = 14;   // dias para trás em que ocorrências recorrentes não feitas viram "atrasadas"
function fuso(){ return (S.cfg&&S.cfg.fuso)||'America/Fortaleza'; }
function hojeStr(agora=new Date(),tz=fuso()){ return new Intl.DateTimeFormat('en-CA',{timeZone:tz,year:'numeric',month:'2-digit',day:'2-digit'}).format(agora); }
function parse(d){ const [y,m,dd]=d.split('-').map(Number); return new Date(Date.UTC(y,m-1,dd)); }
function fmt(dt){ return dt.toISOString().slice(0,10); }
function addDias(d,n){ const x=parse(d); x.setUTCDate(x.getUTCDate()+n); return fmt(x); }
function dow(d){ return parse(d).getUTCDay(); }
function diasNoMes(y,m){ return new Date(Date.UTC(y,m+1,0)).getUTCDate(); }
function diffDias(a,b){ return Math.round((parse(b)-parse(a))/864e5); }
function bissexto(y){ return (y%4===0&&y%100!==0)||y%400===0; }
function hhmm(t){ return t?String(t).slice(0,5):''; }
function diaCurto(d){ const x=parse(d); return `${String(x.getUTCDate()).padStart(2,'0')}/${String(x.getUTCMonth()+1).padStart(2,'0')}`; }
function mesmoDiaMes(ini,d){ const a=parse(ini).getUTCDate(), x=parse(d); return x.getUTCDate()===Math.min(a,diasNoMes(x.getUTCFullYear(),x.getUTCMonth())); }
function mesmoDiaAno(ini,d){
  const a=parse(ini), x=parse(d); if(a.getUTCMonth()!==x.getUTCMonth()) return false;
  if(a.getUTCMonth()===1&&a.getUTCDate()===29&&!bissexto(x.getUTCFullYear())) return x.getUTCDate()===28;   // 29/02 cai em 28/02 nos anos comuns
  return a.getUTCDate()===x.getUTCDate();
}
/* r = {recorrencia, dias_semana, intervalo, intervalo_unidade}; ini = data inicial */
function regraNaData(r,ini,d){
  const dd=diffDias(ini,d); if(dd<0) return false;
  const dias=(r.dias_semana&&r.dias_semana.length)?r.dias_semana:null;
  switch(r.recorrencia){
    case 'diaria': return dias?dias.includes(dow(d)):true;
    case 'semanal': return (dias||[dow(ini)]).includes(dow(d));
    case 'quinzenal': if(!(dias||[dow(ini)]).includes(dow(d))) return false;
      return Math.floor(diffDias(addDias(ini,-dow(ini)),d)/7)%2===0;
    case 'mensal': return mesmoDiaMes(ini,d);
    case 'anual': return mesmoDiaAno(ini,d);
    case 'intervalo': { const n=Math.max(1,+r.intervalo||1), u=r.intervalo_unidade||'dias';
      if(u==='dias') return dd%n===0;
      if(u==='semanas') return dd%(7*n)===0;
      if(u==='meses'){ const a=parse(ini),x=parse(d); const m=(x.getUTCFullYear()-a.getUTCFullYear())*12+x.getUTCMonth()-a.getUTCMonth(); return m%n===0&&mesmoDiaMes(ini,d); }
      return false; }
  }
  return false;
}
function ocorreNaData(t,d){
  if(t.tipo!=='recorrente') return t.data===d;
  const ini=t.rec_inicio||t.data; if(!ini||d<ini) return false;
  if(t.rec_fim&&d>t.rec_fim) return false;
  if(t.excecoes&&t.excecoes.includes(d)) return false;
  return regraNaData(t,ini,d);
}
function ocorrMap(){ const m={}; for(const o of S.ocorr) m[o.tarefa_id+'|'+o.data]=o; return m; }
const OCULTAS=['cancelada','dispensada'];
/* Itens do mural num dia. Cada ocorrência tem estado próprio; nada é gravado só por "existir". */
function itensDoDia(d,{incluirOcultas=false}={}){
  const om=ocorrMap(), out=[];
  for(const t of S.tarefas){
    if(t.tipo!=='recorrente'){
      if(t.data!==d) continue;
      if(OCULTAS.includes(t.situacao)&&!incluirOcultas) continue;
      out.push({t,data:d,dia:d,feito:t.situacao==='concluida',recorrente:false});
    } else if(ocorreNaData(t,d)){
      const o=om[t.id+'|'+d];
      if(o&&o.nova_data&&o.nova_data!==d) continue;               // foi reagendada para outro dia
      if(o&&OCULTAS.includes(o.situacao)&&!incluirOcultas) continue;
      out.push({t,data:d,dia:d,feito:!!(o&&o.situacao==='concluida'),recorrente:true,o});
    }
  }
  for(const o of S.ocorr){
    if(o.nova_data===d&&o.data!==d){
      const t=S.tarefas.find(x=>x.id===o.tarefa_id); if(!t) continue;
      if(OCULTAS.includes(o.situacao)&&!incluirOcultas) continue;
      out.push({t,data:o.data,dia:d,feito:o.situacao==='concluida',recorrente:true,movida:true,o});
    }
  }
  const pr={alta:0,media:1,baixa:2};
  return out.sort((a,b)=>(!!b.t.fixada-!!a.t.fixada)||((a.t.hora_inicio||'99')<(b.t.hora_inicio||'99')?-1:(a.t.hora_inicio||'99')>(b.t.hora_inicio||'99')?1:0)||(pr[a.t.prioridade]-pr[b.t.prioridade]));
}
/* Atrasadas: únicas pendentes de dias passados (sem limite) + ocorrências recorrentes não resolvidas
   dos últimos JANELA_ATRASO dias + ocorrências reagendadas cujo novo dia já passou. Não grava nada. */
function atrasadas(hoje=S.hoje){
  const om=ocorrMap(), out=[];
  for(const t of S.tarefas){
    if(t.tipo!=='recorrente'){
      if(t.situacao==='pendente'&&t.data&&t.data<hoje) out.push({t,data:t.data,dia:t.data,recorrente:false,atraso:diffDias(t.data,hoje)});
    } else if(t.cobrar_atraso!==false){
      for(let i=JANELA_ATRASO;i>=1;i--){ const d=addDias(hoje,-i);
        if(!ocorreNaData(t,d)||om[t.id+'|'+d]) continue;
        out.push({t,data:d,dia:d,recorrente:true,atraso:i}); }
    }
  }
  for(const o of S.ocorr){
    if(o.situacao==='reagendada'&&o.nova_data&&o.nova_data<hoje){
      const t=S.tarefas.find(x=>x.id===o.tarefa_id); if(t&&t.cobrar_atraso!==false) out.push({t,data:o.data,dia:o.nova_data,recorrente:true,movida:true,o,atraso:diffDias(o.nova_data,hoje)});
    }
  }
  return out.sort((a,b)=>a.dia<b.dia?-1:a.dia>b.dia?1:0);
}
/* Histórico dos últimos N dias: concluídas e dispensadas */
function historico(hoje=S.hoje,n=30){
  const lim=addDias(hoje,-n), out=[];
  for(const t of S.tarefas) if(t.tipo!=='recorrente'&&['concluida','dispensada'].includes(t.situacao)&&t.data&&t.data>=lim) out.push({t,data:t.data,dia:t.data,recorrente:false,sit:t.situacao});
  for(const o of S.ocorr){ if(!['concluida','dispensada'].includes(o.situacao)) continue; const dia=o.nova_data||o.data; if(dia<lim) continue;
    const t=S.tarefas.find(x=>x.id===o.tarefa_id); if(t) out.push({t,data:o.data,dia,recorrente:true,o,sit:o.situacao}); }
  return out.sort((a,b)=>a.dia<b.dia?1:-1);
}
function eventoNaData(e,d){
  if(e.excecoes&&e.excecoes.includes(d)) return false;
  if(!e.recorrencia) return e.data===d;
  if(d<e.data||(e.rec_fim&&d>e.rec_fim)) return false;
  return regraNaData(e,e.data,d);
}
function eventosDoDia(d){ return S.eventos.filter(e=>eventoNaData(e,d)).sort((a,b)=>(a.hora_inicio||'99')<(b.hora_inicio||'99')?-1:1); }
/* Próximo aniversário (ano de nascimento não é necessário) */
function proxAniv(a,hoje=S.hoje){
  const y=parse(hoje).getUTCFullYear();
  const alvo=yy=>{ let dia=+a.dia; if(+a.mes===2&&dia===29&&!bissexto(yy)) dia=28; return fmt(new Date(Date.UTC(yy,a.mes-1,dia))); };
  let d=alvo(y); if(d<hoje) d=alvo(y+1);
  return {data:d,falta:diffDias(hoje,d)};
}
function proxDataImportante(x,hoje=S.hoje){
  if(!x.anual) return x.data>=hoje?{data:x.data,falta:diffDias(hoje,x.data)}:null;
  return proxAniv({dia:+x.data.slice(8,10),mes:+x.data.slice(5,7)},hoje);
}
/* Central de notificações: gerada a partir dos dados, com chave única (sem duplicar) */
function gerarNotificacoes(hoje=S.hoje){
  const out=[], amanha=addDias(hoje,1);
  for(const x of itensDoDia(hoje)) if(!x.feito&&x.t.prioridade==='alta')
    out.push({chave:`prio|${x.t.id}|${x.data}`,tipo:'prio',titulo:x.t.titulo,texto:'Prioridade alta para hoje'+(x.t.hora_inicio?' · '+hhmm(x.t.hora_inicio):''),ir:'inicio'});
  for(const x of atrasadas(hoje))
    out.push({chave:`atraso|${x.t.id}|${x.data}`,tipo:'atraso',titulo:x.t.titulo,texto:`Atrasada há ${x.atraso} dia${x.atraso>1?'s':''}`,ir:'tarefas'});
  for(const d of [hoje,amanha]) for(const e of eventosDoDia(d))
    out.push({chave:`ev|${e.id}|${d}`,tipo:'ev',titulo:e.titulo,texto:(d===hoje?'Hoje':'Amanhã')+(e.hora_inicio?' às '+hhmm(e.hora_inicio):'')+(e.local?' · '+e.local:''),ir:'agenda'});
  for(const a of S.aniv){ const p=proxAniv(a,hoje); if(p.falta<=(a.antecedencia??7))
    out.push({chave:`aniv|${a.id}|${p.data}`,tipo:'aniv',titulo:a.nome,texto:p.falta===0?'Faz aniversário hoje':`Aniversário em ${p.falta} dia${p.falta>1?'s':''} (${diaCurto(p.data)})`,ir:'datas'}); }
  for(const x of S.datas){ const p=proxDataImportante(x,hoje); if(p&&p.falta<=(x.antecedencia??7))
    out.push({chave:`data|${x.id}|${p.data}`,tipo:'data',titulo:x.nome,texto:p.falta===0?'É hoje':`Em ${p.falta} dia${p.falta>1?'s':''} (${diaCurto(p.data)})`,ir:'datas'}); }
  const vistos=new Set(); return out.filter(n=>!vistos.has(n.chave)&&vistos.add(n.chave));
}

function horaLocal(){ return +new Intl.DateTimeFormat('en-GB',{timeZone:fuso(),hour:'2-digit',hour12:false}).format(new Date()); }
function diaLongo(d){ const x=parse(d); return `${DIAS_LONGO[x.getUTCDay()]}, ${x.getUTCDate()} de ${MESES[x.getUTCMonth()]} de ${x.getUTCFullYear()}`; }
function diaLongoC(d){ const s=diaLongo(d); return s.charAt(0).toUpperCase()+s.slice(1); }
function horario(t){ if(!t.hora_inicio) return 'Durante o dia'; return hhmm(t.hora_inicio)+(t.hora_fim?' – '+hhmm(t.hora_fim):''); }
function emDias(n){ return n===0?'hoje':n===1?'amanhã':`em ${n} dias`; }
async function sha256(s){ const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s)); return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join(''); }

function toast(msg,err=false,acao){
  const el=document.createElement('div'); el.className='toast'+(err?' err':''); el.setAttribute('role',err?'alert':'status');
  el.innerHTML=ic(err?'alert-triangle':'check-circle-2')+`<span>${esc(msg)}</span>`+(acao?`<button class="btn sm gold" style="margin-left:6px">${esc(acao.label)}</button>`:'');
  const tc=$('#toasts'); tc.appendChild(el); while(tc.children.length>3) tc.firstElementChild.remove(); icons();
  if(acao){ el.querySelector('button').onclick=()=>{ el.remove(); acao.run(); }; }
  else setTimeout(()=>el.remove(),err?6000:3000);
}
function erro(e,ctx){ console.error(ctx,e); toast(`${ctx}: ${e&&e.message?e.message:e}`,true); }

let modalAberto=null;
function abrirModal(html,{wide=false}={}){
  fecharModal();
  const bg=document.createElement('div'); bg.className='modal-bg';
  bg.innerHTML=`<div class="modal${wide?' wide':''}" role="dialog" aria-modal="true">${html}</div>`;
  bg.addEventListener('mousedown',e=>{ if(e.target===bg) fecharModal(); });
  document.body.appendChild(bg); modalAberto=bg; icons();
  const f=bg.querySelector('input,textarea,select,button'); f&&f.focus();
  return bg.firstElementChild;
}
function fecharModal(){ if(modalAberto){ modalAberto.remove(); modalAberto=null; } }
function confirmar(titulo,texto,rotulo='Excluir'){
  return new Promise(res=>{
    const m=abrirModal(`<h3>${ic('alert-triangle')} ${esc(titulo)}</h3><p class="muted">${esc(texto)}</p>
      <div class="foot"><button class="btn" data-x="0">Cancelar</button><button class="btn primary" data-x="1">${esc(rotulo)}</button></div>`);
    m.querySelectorAll('[data-x]').forEach(b=>b.onclick=()=>{ fecharModal(); res(b.dataset.x==='1'); });
    m.querySelector('[data-x="0"]').focus();
  });
}
/* Pergunta com várias opções (radio). Resolve com o valor escolhido ou null. */
function escolher(titulo,texto,opcoes,rotulo='Confirmar'){
  return new Promise(res=>{
    const m=abrirModal(`<h3>${ic('help-circle')} ${esc(titulo)}</h3>${texto?`<p class="muted small">${esc(texto)}</p>`:''}
      <div class="opts">${opcoes.map((o,i)=>`<label class="opt"><input type="radio" name="esc" value="${esc(o.v)}" ${i===0?'checked':''}><span><b>${esc(o.l)}</b>${o.d?`<small>${esc(o.d)}</small>`:''}</span></label>`).join('')}</div>
      <div class="foot"><button class="btn" data-x="0">Cancelar</button><button class="btn primary" data-x="1">${esc(rotulo)}</button></div>`);
    m.querySelector('[data-x="0"]').onclick=()=>{ fecharModal(); res(null); };
    m.querySelector('[data-x="1"]').onclick=()=>{ const v=m.querySelector('input[name="esc"]:checked').value; fecharModal(); res(v); };
  });
}
let menuAberto=null;
function abrirMenu(anchor,itens){
  fecharMenu();
  const r=anchor.getBoundingClientRect(); const m=document.createElement('div'); m.className='menu-pop'; m.setAttribute('role','menu');
  m.innerHTML=itens.map((it,i)=>it.sep?'<hr>':`<button role="menuitem" data-i="${i}" class="${it.danger?'danger':''}">${ic(it.icon)} ${esc(it.label)}</button>`).join('');
  document.body.appendChild(m);
  const w=m.offsetWidth; m.style.top=Math.max(8,Math.min(r.bottom+4,innerHeight-m.offsetHeight-8))+'px'; m.style.left=Math.max(8,Math.min(r.right-w,innerWidth-w-8))+'px';
  m.querySelectorAll('button').forEach(b=>b.onclick=()=>{ fecharMenu(); itens[+b.dataset.i].run(); });
  menuAberto=m; icons(); m.querySelector('button').focus();
  setTimeout(()=>document.addEventListener('mousedown',fecharMenuFora),0);
}
function fecharMenuFora(e){ if(menuAberto&&!menuAberto.contains(e.target)) fecharMenu(); }

function temaAtual(){ const t=document.documentElement.dataset.theme; if(t) return t; return matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light'; }
function alternarTema(){ store.set('vp_tema',temaAtual()==='dark'?'light':'dark'); aplicarTema(); renderTopo(); if(S.rota==='config') render(); }
aplicarTema();

/* ---------------- Ações de tarefa ---------------- */
function trocaOcorr(o){ S.ocorr=S.ocorr.filter(x=>!(x.tarefa_id===o.tarefa_id&&x.data===o.data)); S.ocorr.push(o); }
async function marcarOcorrencia(it,situacao){
  const nova=it.o&&it.o.nova_data?it.o.nova_data:null;
  trocaOcorr(await db.upsertOcorrencia({tarefa_id:it.t.id,data:it.data,situacao,nova_data:nova}));
}
async function alternarConcluida(it){
  try{
    if(!it.recorrente){
      const r=await db.upd('tarefas',it.t.id,{situacao:it.feito?'pendente':'concluida',atualizado_em:new Date().toISOString()}); Object.assign(it.t,r);
    } else if(it.feito){
      if(it.o&&it.o.nova_data) trocaOcorr(await db.upsertOcorrencia({tarefa_id:it.t.id,data:it.data,situacao:'reagendada',nova_data:it.o.nova_data}));
      else { await db.deleteOcorrencia(it.t.id,it.data); S.ocorr=S.ocorr.filter(o=>!(o.tarefa_id===it.t.id&&o.data===it.data)); }
    } else await marcarOcorrencia(it,'concluida');
    toast(it.feito?'Tarefa reaberta':'Tarefa concluída'); render();
  }catch(e){ erro(e,'Não foi possível atualizar'); }
}
async function concluirAtrasada(it){
  try{ if(!it.recorrente){ Object.assign(it.t,await db.upd('tarefas',it.t.id,{situacao:'concluida',atualizado_em:new Date().toISOString()})); } else await marcarOcorrencia(it,'concluida');
    toast('Concluída'); render(); }catch(e){ erro(e,'Não foi possível concluir'); }
}
async function dispensar(it){
  try{ if(!it.recorrente){ Object.assign(it.t,await db.upd('tarefas',it.t.id,{situacao:'dispensada',atualizado_em:new Date().toISOString()})); } else await marcarOcorrencia(it,'dispensada');
    toast('Dispensada — pode ser reativada no Histórico',false); render(); }catch(e){ erro(e,'Não foi possível dispensar'); }
}
async function reativar(it){
  try{
    if(!it.recorrente){ Object.assign(it.t,await db.upd('tarefas',it.t.id,{situacao:'pendente',atualizado_em:new Date().toISOString()})); }
    else if(it.o&&it.o.nova_data) trocaOcorr(await db.upsertOcorrencia({tarefa_id:it.t.id,data:it.data,situacao:'reagendada',nova_data:it.o.nova_data}));
    else { await db.deleteOcorrencia(it.t.id,it.data); S.ocorr=S.ocorr.filter(o=>!(o.tarefa_id===it.t.id&&o.data===it.data)); }
    toast('Tarefa reativada'); render();
  }catch(e){ erro(e,'Não foi possível reativar'); }
}
function chaveMantida(it){ return it.t.id+'|'+it.data; }
function mantidasHoje(){ try{ return JSON.parse(store.get('vp_mant_'+S.hoje)||'[]'); }catch(e){ return []; } }
function manterPendente(it){ const l=mantidasHoje(); if(!l.includes(chaveMantida(it))) l.push(chaveMantida(it)); store.set('vp_mant_'+S.hoje,JSON.stringify(l)); toast('Mantida pendente. Continua em Tarefas → Atrasadas.'); render(); }
async function alternarFixada(t){

function reagendar(it){
  const m=abrirModal(`<h3>${ic('calendar-clock')} Reagendar</h3>
    <p class="muted small">${esc(it.t.titulo)}${it.recorrente?' — só a ocorrência de '+diaCurto(it.data)+'; as próximas repetições continuam.':''}</p>
    <div class="field"><label class="f" for="rg-d">Nova data</label><input class="inp" type="date" id="rg-d" value="${it.dia<S.hoje?S.hoje:addDias(S.hoje,1)}"></div>
    <div class="foot"><button class="btn" id="rg-c">Cancelar</button><button class="btn primary" id="rg-s">${ic('check')} Reagendar</button></div>`);
  m.querySelector('#rg-c').onclick=fecharModal;
  m.querySelector('#rg-s').onclick=async()=>{
    const d=m.querySelector('#rg-d').value; if(!d) return;
    try{
      if(!it.recorrente) Object.assign(it.t,await db.upd('tarefas',it.t.id,{data:d,situacao:'pendente',atualizado_em:new Date().toISOString()}));
      else if(d===it.data){ await db.deleteOcorrencia(it.t.id,it.data); S.ocorr=S.ocorr.filter(o=>!(o.tarefa_id===it.t.id&&o.data===it.data)); }
      else trocaOcorr(await db.upsertOcorrencia({tarefa_id:it.t.id,data:it.data,situacao:'reagendada',nova_data:d}));
      fecharModal(); toast('Reagendada para '+diaCurto(d)); render();
    }catch(e){ erro(e,'Não foi possível reagendar'); }
  };
}
/* Excluir definitivamente. it.data = a ocorrência clicada (ou null quando vem da lista). */
async function excluirTarefa(t,data=null){
  try{
    if(t.tipo!=='recorrente'){
      if(!await confirmar('Excluir definitivamente?',`"${t.titulo}" será apagada para sempre. Esta operação não pode ser desfeita. (Se quiser só tirar do mural, use Dispensar.)`)) return;
      await db.del('tarefas',t.id); removerLocal(t.id); toast('Tarefa excluída'); render(); return;
    }
    const ops=[];
    if(data) ops.push({v:'so',l:`Excluir somente a ocorrência de ${diaCurto(data)}`,d:'As outras repetições continuam.'});
    const ref=data||S.hoje;
    ops.push({v:'prox',l:data?`Excluir esta e as próximas`:`Encerrar a partir de hoje`,d:`A série termina em ${diaCurto(addDias(ref,-1))}; o histórico anterior é mantido.`});
    ops.push({v:'serie',l:'Excluir toda a série',d:'Apaga a tarefa, todas as repetições e o histórico de conclusões. Não pode ser desfeito.'});
    const v=await escolher('Excluir tarefa automática',`"${t.titulo}" — ${descricaoRec(t)}`,ops,'Excluir');
    if(!v) return;
    const ini=t.rec_inicio||t.data;
    if(v==='so'){ trocaOcorr(await db.upsertOcorrencia({tarefa_id:t.id,data,situacao:'cancelada',nova_data:null})); toast('Ocorrência excluída'); }
    else if(v==='prox'&&ref>ini){
      const fim=addDias(ref,-1);
      Object.assign(t,await db.upd('tarefas',t.id,{rec_fim:t.rec_fim&&t.rec_fim<fim?t.rec_fim:fim,atualizado_em:new Date().toISOString()}));
      await db.deleteOcorrenciasDesde(t.id,ref); S.ocorr=S.ocorr.filter(o=>!(o.tarefa_id===t.id&&o.data>=ref));
      toast(`Série encerrada em ${diaCurto(fim)}`);
    } else {
      if(v==='prox'&&!await confirmar('Excluir toda a série?','Esta data é o início da série, então "esta e as próximas" equivale a apagar a série inteira.')) return;
      await db.del('tarefas',t.id); removerLocal(t.id); toast('Série excluída');
    }
    render();
  }catch(e){ erro(e,'Não foi possível excluir'); }
}
function removerLocal(id){ S.tarefas=S.tarefas.filter(x=>x.id!==id); S.ocorr=S.ocorr.filter(o=>o.tarefa_id!==id); if(S.t.edit===id){ S.t.edit=null; S.t.form=null; } }

/* ---------------- Post-its ---------------- */
let REG={}; let regN=0;
function reg(o){ const k='k'+(++regN); REG[k]=o; return k; }
function postit(it,{preview=false}={}){
  const t=it.t, k=preview?'':reg(it);
  return `<article class="postit c-${esc(t.cor||'amarelo')}${it.feito?' done':''}${t.prioridade==='alta'&&!it.feito?' prio':''}" ${k?`data-k="${k}"`:''}>
    <div class="pt-top">
      <button class="pt-check" ${k?`data-act="check"`:''} aria-label="${it.feito?'Reabrir':'Concluir'}: ${esc(t.titulo)}" aria-pressed="${!!it.feito}">${ic('check')}</button>
      <div class="pt-title">${esc(t.titulo||'Título da tarefa')}</div>
      ${t.fixada?`<span class="pt-pin" title="Fixado">${ic('pin')}</span>`:''}
      ${k?`<button class="pt-menu" data-act="menu" aria-label="Opções de ${esc(t.titulo)}">${ic('more-horizontal')}</button>`:''}
    </div>
    <div class="pt-badges">
      <span class="pt-badge${it.recorrente?' auto':''}">${it.recorrente?'Automática':'Manual'}</span>
      ${t.prioridade==='alta'?'<span class="pt-badge alta">Alta</span>':''}
      ${it.movida?`<span class="pt-badge">Reagendada de ${diaCurto(it.data)}</span>`:''}
    </div>
    <div class="pt-foot">${ic(CAT_ICON[t.categoria]||'sticky-note')} <span>${esc(horario(t))}</span></div>

}
function postitEvento(e,d){
  const c=CAT_EV[e.tipo]||CAT_EV.pessoal, k=reg({e,d});
  return `<article class="postit c-${c[1]} evento${e.prioridade==='alta'?' prio':''}" data-ev="${k}">
    <div class="pt-top"><span class="pt-cal" aria-hidden="true">${ic(c[2])}</span>
      <div class="pt-title">${esc(e.titulo)}</div>
      <button class="pt-menu" data-act="menu" aria-label="Opções de ${esc(e.titulo)}">${ic('more-horizontal')}</button></div>
    <div class="pt-badges"><span class="pt-badge ag">${ic('calendar-days','style="width:11px;height:11px"')} Agenda · ${esc(c[0])}</span>${e.prioridade==='alta'?'<span class="pt-badge alta">Alta</span>':''}</div>
    <div class="pt-foot">${ic('clock')} <span>${esc(horario(e))}</span></div>
    ${e.local?`<div class="pt-foot sub">${ic('map-pin')} <span>${esc(e.local)}</span></div>`:''}
  </article>`;
}
function ligarPostits(scope){
  scope.querySelectorAll('.postit[data-k]').forEach(el=>{
    const it=REG[el.dataset.k];
    el.querySelector('[data-act="check"]').onclick=()=>alternarConcluida(it);
    el.querySelector('[data-act="menu"]').onclick=e=>{ e.stopPropagation(); menuTarefa(e.currentTarget,it); };
    el.ondblclick=e=>{ if(!e.target.closest('button')) editarTarefa(it.t); };
  });
  scope.querySelectorAll('.postit[data-ev]').forEach(el=>{
    const {e,d}=REG[el.dataset.ev];
    el.querySelector('[data-act="menu"]').onclick=ev=>{ ev.stopPropagation(); abrirMenu(ev.currentTarget,[
      {icon:'pencil',label:'Editar evento',run:()=>formEvento(e)},
      {icon:'calendar-days',label:'Ver na agenda',run:()=>{ S.ag.ref=d; S.ag.sel=d; ir('agenda'); }},
      {sep:true},{icon:'trash-2',label:'Excluir evento',danger:true,run:()=>excluirEvento(e,d)}]); };
    el.ondblclick=ev=>{ if(!ev.target.closest('button')) formEvento(e); };
  });
}
/* Mistura tarefas e eventos do dia em ordem: fixadas, depois por horário */
function cardsDoDia(d){
  const cs=[...itensDoDia(d).map(x=>({h:x.t.hora_inicio||'99',fix:!!x.t.fixada,html:()=>postit(x)})),
    ...eventosDoDia(d).filter(e=>e.no_mural!==false).map(e=>({h:e.hora_inicio||'99',fix:false,html:()=>postitEvento(e,d)}))];
  return cs.sort((a,b)=>(b.fix-a.fix)||(a.h<b.h?-1:a.h>b.h?1:0)).map(c=>c.html()).join('');
}

async function fetchJSON(url,ms=12000){
  const ac=new AbortController(), t=setTimeout(()=>ac.abort(),ms);
  try{ const r=await fetch(url,{signal:ac.signal}); if(!r.ok) throw new Error('HTTP '+r.status); return await r.json(); }

  finally{ clearTimeout(t); }
}

  if(!navigator.onLine){ if(S.clima&&S.clima.chave===chave) S.clima={...S.clima,falhou:true}; else S.clima={erro:'Sem internet: clima indisponível.'}; pintar('clima'); return; }

async function atualizarDolar(forcar=false){
  const cache=cacheGet('vp_dolar');

  if(!navigator.onLine){ S.dolar=S.dolar&&S.dolar.venda?{...S.dolar,falhou:true}:{erro:'Sem internet: cotação indisponível.'}; pintar('dolar'); return; }
  try{
    let lista=[], fonte='Banco Central (Olinda)';
    try{
      const u=`https://olinda.bcb.gov.br/olinda/servico/PTAX/versao/v1/odata/CotacaoDolarPeriodo(dataInicial=@dataInicial,dataFinalCotacao=@dataFinalCotacao)?@dataInicial='${mdY(addDias(S.hoje,-12))}'&@dataFinalCotacao='${mdY(S.hoje)}'&$format=json&$select=cotacaoCompra,cotacaoVenda,dataHoraCotacao`;

    }catch(e1){
      // Segunda fonte do próprio Banco Central: série SGS 1 = dólar PTAX (venda), diário
      const j=await fetchJSON('https://api.bcb.gov.br/dados/serie/bcdata.sgs.1/dados/ultimos/2?formato=json');
      lista=(j||[]).map(v=>{ const [d,m,y]=String(v.data).split('/'); return {venda:+String(v.valor).replace(',','.'),compra:null,quando:`${y}-${m}-${d}`}; });
      fonte='Banco Central (SGS)';
    }
    lista=lista.filter(x=>x.venda>0);
    if(!lista.length) throw new Error('sem cotação no período');
    const u1=lista[lista.length-1], u0=lista.length>1?lista[lista.length-2]:null;
    S.dolar={obtido:Date.now(),diaBusca:S.hoje,fonte,venda:u1.venda,compra:u1.compra,quando:u1.quando,ant:u0?u0.venda:null,antData:u0?u0.quando.slice(0,10):null,

function filtrarTarefas(){
  const f=S.t.filtro, h=S.hoje, a=addDias(h,1), q=S.t.busca.toLowerCase();
  const ids=f==='hoje'?new Set(itensDoDia(h).map(x=>x.t.id)):f==='amanha'?new Set(itensDoDia(a).map(x=>x.t.id)):null;
  return S.tarefas.filter(t=>{
    if(S.t.cat&&t.categoria!==S.t.cat) return false;
    if(q&&!(`${t.titulo} ${t.descricao||''}`.toLowerCase().includes(q))) return false;
    switch(f){
      case 'hoje': case 'amanha': return ids.has(t.id);
      case 'auto': return t.tipo==='recorrente';
      case 'manual': return t.tipo!=='recorrente';
    }
    return true;

function dicaDias(rec){ return rec==='diaria'?'Nenhum marcado = todos os dias.':rec==='dias'?'Marque pelo menos um dia.':'Nenhum marcado = mesmo dia da semana da data de início.'; }
function tarefaDoForm(F){
  const o={titulo:F.titulo.trim(),descricao:F.descricao.trim()||null,categoria:F.categoria,cor:F.cor,prioridade:F.prioridade,tipo:F.tipo,
    hora_inicio:F.hora_inicio||null,hora_fim:F.hora_fim||null,fixada:F.fixada};
  if(F.tipo!=='recorrente') return Object.assign(o,{data:F.data,recorrencia:null,dias_semana:null,rec_inicio:null,rec_fim:null,intervalo:null,intervalo_unidade:null,excecoes:null,situacao:S.t.edit?F.situacao:'pendente'});
  const rec=F.rec==='dias'?'semanal':F.rec;
  const dias=['dias','quinzenal','diaria'].includes(F.rec)&&F.dias_semana.length?F.dias_semana.slice().sort():null;
  return Object.assign(o,{data:null,recorrencia:rec,dias_semana:dias,rec_inicio:F.rec_inicio,rec_fim:F.rec_fim||null,
    intervalo:rec==='intervalo'?Math.max(1,parseInt(F.intervalo)||1):null,intervalo_unidade:rec==='intervalo'?F.intervalo_unidade:null,
    excecoes:F.excecoes.length?F.excecoes.slice().sort():null,cobrar_atraso:F.cobrar_atraso,situacao:'pendente'});
}
function ligarForm(m){
  const F=S.t.form;
  const sync=()=>{
    F.titulo=$('#f-tit').value; F.descricao=$('#f-desc').value; F.categoria=$('#f-cat').value; F.prioridade=$('#f-pri').value;
    F.data=$('#f-data').value; F.rec_inicio=$('#f-ini').value; F.rec_fim=$('#f-fim').value; F.hora_inicio=$('#f-hi').value; F.hora_fim=$('#f-hf').value;
    F.intervalo=$('#f-intn').value; F.intervalo_unidade=$('#f-intu').value; F.cobrar_atraso=$('#f-cob').checked;
    F.fixada=$('#f-fix').checked; const s=$('#f-sit'); if(s) F.situacao=s.value;
    $('#f-cnt').textContent=F.descricao.length+'/500';
    const t=tarefaDoForm(F);
    $('#f-prev').innerHTML=postit({t,feito:false,recorrente:F.tipo==='recorrente'},{preview:true});
    if(F.tipo==='recorrente'&&t.rec_inicio){ const prox=[]; for(let i=0,d=t.rec_inicio<S.hoje?S.hoje:t.rec_inicio;i<400&&prox.length<4;i++,d=addDias(d,1)) if(ocorreNaData({...t,tipo:'recorrente'},d)) prox.push(diaCurto(d)+' '+DIAS[dow(d)].toLowerCase());
      $('#f-next').textContent=prox.length?'Próximas: '+prox.join(' · '):'Nenhuma ocorrência futura com estas regras.'; }
    else $('#f-next').textContent='';
    icons();
  };
  sync();
  $('#tf').addEventListener('input',sync); $('#tf').addEventListener('change',sync);
  m.querySelectorAll('[data-cor]').forEach(b=>b.onclick=()=>{ F.cor=b.dataset.cor; m.querySelectorAll('[data-cor]').forEach(x=>x.setAttribute('aria-pressed',x===b)); sync(); });
  m.querySelectorAll('[data-tipo]').forEach(b=>b.onclick=()=>{ F.tipo=b.dataset.tipo; m.querySelectorAll('[data-tipo]').forEach(x=>x.setAttribute('aria-pressed',x===b));
    $('#f-unica').classList.toggle('hidden',F.tipo==='recorrente'); $('#f-rec').classList.toggle('hidden',F.tipo!=='recorrente'); sync(); });
  m.querySelectorAll('[data-rec]').forEach(b=>b.onclick=()=>{ F.rec=b.dataset.rec; m.querySelectorAll('[data-rec]').forEach(x=>x.setAttribute('aria-pressed',x===b));
    const w=['dias','quinzenal','diaria'].includes(F.rec); $('#f-dias-w').classList.toggle('hidden',!w); $('#f-int').classList.toggle('hidden',F.rec!=='intervalo');
    $('#f-dias-h').textContent=dicaDias(F.rec); sync(); });
  m.querySelectorAll('[data-dia]').forEach(b=>b.onclick=()=>{ const i=+b.dataset.dia; F.dias_semana=F.dias_semana.includes(i)?F.dias_semana.filter(x=>x!==i):[...F.dias_semana,i]; b.setAttribute('aria-pressed',F.dias_semana.includes(i)); sync(); });
  $('#f-exc-add').onclick=()=>{ const d=$('#f-exc').value; if(!d) return; if(!F.excecoes.includes(d)) F.excecoes.push(d); render(); };
  m.querySelectorAll('[data-exc]').forEach(b=>b.onclick=()=>{ F.excecoes=F.excecoes.filter(x=>x!==b.dataset.exc); render(); });
  $('#f-can').onclick=()=>{ S.t.edit=null; S.t.form=formVazio(); render(); };
  const nv=$('#f-novo'); if(nv) nv.onclick=()=>{ S.t.edit=null; S.t.form=formVazio(); render(); };
  const dl=$('#f-del'); if(dl) dl.onclick=()=>excluirTarefa(S.tarefas.find(t=>t.id===S.t.edit));
  $('#tf').onsubmit=async e=>{
    e.preventDefault(); sync();
    const foco=(id,msg)=>{ toast(msg,true); $(id).focus(); };
    if(!F.titulo.trim()) return foco('#f-tit','Informe o título da tarefa');
    if(F.tipo!=='recorrente'&&!F.data) return foco('#f-data','Informe a data da tarefa');
    if(F.tipo==='recorrente'){
      if(!F.rec_inicio) return foco('#f-ini','Informe a data de início da repetição');
      if(F.rec_fim&&F.rec_fim<F.rec_inicio) return foco('#f-fim','O término não pode ser antes do início');
      if(F.rec==='dias'&&!F.dias_semana.length) return toast('Marque pelo menos um dia da semana',true);
      if(F.rec==='intervalo'&&!(parseInt(F.intervalo)>=1)) return foco('#f-intn','Informe um intervalo de 1 ou mais');
    }
    if(F.hora_inicio&&F.hora_fim&&F.hora_fim<F.hora_inicio) return foco('#f-hf','O horário final é antes do inicial');
    const o=tarefaDoForm(F); o.atualizado_em=new Date().toISOString();
    const bt=$('#f-save'); bt.disabled=true; bt.innerHTML=ic('loader')+' Salvando...'; icons();
    try{
      if(S.t.edit){ const t=S.tarefas.find(x=>x.id===S.t.edit); Object.assign(t,await db.upd('tarefas',S.t.edit,o)); toast('Tarefa atualizada'); }
      else { S.tarefas.push(await db.ins('tarefas',o)); toast('Tarefa criada'); }
      S.t.edit=null; S.t.form=formVazio(); render();
    }catch(err){ bt.disabled=false; bt.innerHTML=ic('save')+' Salvar tarefa'; icons(); erro(err,'Não foi possível salvar'); }
  };
}

      recorrencia:g('#ev-r')||null,rec_fim:g('#ev-r')?(g('#ev-f')||null):null,dias_semana:['semanal','quinzenal'].includes(g('#ev-r'))&&dias.length?dias.sort():null,
      descricao:g('#ev-de').trim()||null,observacoes:g('#ev-o').trim()||null,no_mural:m.querySelector('#ev-m').checked};
    if(!o.titulo||!o.data){ toast('Informe o título e a data',true); return; }
    if(o.hora_inicio&&o.hora_fim&&o.hora_fim<o.hora_inicio){ toast('O horário final é antes do inicial',true); return; }
    if(o.rec_fim&&o.rec_fim<o.data){ toast('O término não pode ser antes da data',true); return; }
    try{
      if(e){ Object.assign(e,await db.upd('eventos',e.id,o)); toast('Evento atualizado'); }
      else { S.eventos.push(await db.ins('eventos',o)); toast('Evento criado'); }
      fecharModal(); render();
    }catch(err){ erro(err,'Não foi possível salvar o evento'); }
  };
}
async function excluirEvento(e,data){
  try{
    if(!e.recorrencia){
      if(!await confirmar('Excluir evento?',`"${e.titulo}" será apagado definitivamente.`)) return;
      await db.del('eventos',e.id); S.eventos=S.eventos.filter(x=>x.id!==e.id); toast('Evento excluído'); render(); return;
    }
    const ops=[]; if(data) ops.push({v:'so',l:`Somente ${diaCurto(data)}`,d:'As outras datas continuam.'});
    const ref=data||S.hoje;
    ops.push({v:'prox',l:data?'Esta e as próximas':'A partir de hoje',d:`A repetição termina em ${diaCurto(addDias(ref,-1))}.`});
    ops.push({v:'serie',l:'Toda a série',d:'Apaga o evento e todas as repetições.'});
    const v=await escolher('Excluir evento que se repete',`"${e.titulo}"`,ops,'Excluir'); if(!v) return;
    if(v==='so') Object.assign(e,await db.upd('eventos',e.id,{excecoes:[...(e.excecoes||[]),data]}));
    else if(v==='prox'&&ref>e.data) Object.assign(e,await db.upd('eventos',e.id,{rec_fim:addDias(ref,-1)}));
    else { await db.del('eventos',e.id); S.eventos=S.eventos.filter(x=>x.id!==e.id); }
    toast('Evento atualizado'); render();
  }catch(err){ erro(err,'Não foi possível excluir'); }
}

function itensAgenda(d){
  return [
    ...eventosDoDia(d).map(e=>({kind:'ev',e,titulo:e.titulo,hora:hhmm(e.hora_inicio),cls:'bg-'+(CAT_EV[e.tipo]||CAT_EV.pessoal)[1]+' ev-ag'})),
    ...itensDoDia(d).map(x=>({kind:'t',it:x,titulo:x.t.titulo,hora:hhmm(x.t.hora_inicio),cls:'bg-'+x.t.cor,feito:x.feito}))
  ].sort((a,b)=>(a.hora||'99')<(b.hora||'99')?-1:1);
}
function chip(i,tag='span'){ const k=tag==='button'?reg(i):''; return `<${tag} class="ev ${i.cls}${i.feito?' feito':''}" ${k?`data-chip="${k}"`:''} title="${esc((i.hora?i.hora+' · ':'')+i.titulo)}">${i.kind==='ev'?'◆ ':''}${i.hora?esc(i.hora)+' ':''}${esc(i.titulo)}</${tag}>`; }
function abrirChip(i,d){ if(i.kind==='ev') formEvento(i.e); else editarTarefa(i.it.t); }
function pgAgenda(m){
  const A=S.ag; if(!A.ref) A.ref=S.hoje; if(!A.sel) A.sel=S.hoje;

  let titulo='', corpo='';
  if(A.modo==='mes'){
    titulo=`${MESES[mo]} de ${y}`;
    const first=fmt(new Date(Date.UTC(y,mo,1))), start=addDias(first,-dow(first));
    const semanas=Math.ceil((dow(first)+diasNoMes(y,mo))/7);
    let cells=''; for(let i=0;i<semanas*7;i++){ const d=addDias(start,i), its=itensAgenda(d), x=parse(d);
      cells+=`<button class="day${x.getUTCMonth()!==mo?' out':''}${d===S.hoje?' today':''}${d===A.sel?' sel':''}" data-d="${d}" aria-label="${diaLongo(d)}, ${its.length} itens"><span class="n">${x.getUTCDate()}</span>
        ${its.slice(0,3).map(i=>chip(i)).join('')}${its.length>3?`<span class="more">+${its.length-3}</span>`:''}
        <span class="dotline">${its.slice(0,6).map(i=>`<span class="dot ${i.cls}"></span>`).join('')}</span></button>`; }
    corpo=`<div class="month">${DIAS.map(d=>`<div class="wd">${d}</div>`).join('')}${cells}</div>`;
  } else if(A.modo==='semana'){
    const ini=addDias(A.ref,-dow(A.ref)), fim=addDias(ini,6);
    titulo=`${diaCurto(ini)} a ${diaCurto(fim)}`;
    corpo=`<div class="week">${[0,1,2,3,4,5,6].map(i=>{const d=addDias(ini,i), its=itensAgenda(d); return `<div class="wcol${d===S.hoje?' today':''}"><h4>${DIAS[i]}<b>${parse(d).getUTCDate()}</b></h4>${its.length?its.map(x=>chip(x,'button')).join(''):'<span class="muted small" style="text-align:center">—</span>'}</div>`;}).join('')}</div>`;
  } else {
    titulo='Próximos 30 dias';
    let g=''; for(let i=0;i<30;i++){ const d=addDias(S.hoje,i), its=itensAgenda(d); if(!its.length) continue;
      g+=`<div class="grp"><h4>${i===0?'Hoje · ':i===1?'Amanhã · ':''}${i<2?diaLongo(d):diaLongoC(d)}</h4><div class="stack" style="gap:6px">${its.map(x=>chip(x,'button')).join('')}</div></div>`; }
    corpo=`<div class="agenda-list">${g||'<div class="empty">Nada agendado nos próximos 30 dias.</div>'}</div>`;
  }
  const sel=itensAgenda(A.sel);
  m.innerHTML=`${cabecalho('calendar-days','Agenda e Datas Importantes','Acompanhe compromissos, cultos, reuniões e momentos especiais.',
      `<div style="display:flex;gap:10px;flex-wrap:wrap"><button class="btn primary" id="ag-ne">${ic('calendar-plus')} Novo evento</button><button class="btn" id="ag-nt">${ic('plus')} Nova tarefa</button><button class="btn" id="ag-na">${ic('cake')} Novo aniversário</button></div>`)}
  <div class="grid-agenda">
    <section class="card">
      <div class="cal-bar">
        <button class="btn sm" id="ag-prev" aria-label="Anterior">${ic('chevron-left')}</button>
        <button class="btn sm" id="ag-hoje">Hoje</button>
        <button class="btn sm" id="ag-next" aria-label="Próximo">${ic('chevron-right')}</button>
        <h2>${titulo.charAt(0).toUpperCase()+titulo.slice(1)}</h2>
        <div class="seg" style="margin-left:auto;flex:0 0 auto">${[['mes','Mês'],['semana','Semana'],['lista','Lista']].map(([k,l])=>`<button data-modo="${k}" aria-pressed="${A.modo===k}" style="min-width:80px">${l}</button>`).join('')}</div>
      </div>
      ${corpo}
      <div class="legend"><span><span class="dot bg-amarelo"></span>Tarefas (cor do post-it)</span><span>◆ Eventos:</span>${Object.values(CAT_EV).map(c=>`<span><span class="dot bg-${c[1]}" style="border-radius:3px"></span>${c[0]}</span>`).join('')}</div>
    </section>
    <aside class="stack">
      <section class="card"><div class="card-head"><h2>${ic('calendar-check')} ${diaLongoC(A.sel)}</h2></div>
        ${sel.length?`<div class="list-rows">${sel.map(i=>{const k=reg(i); return `<button class="lr lr-btn" data-sel="${k}"><span class="d">${i.hora||'—'}</span><span class="dot ${i.cls}"></span><span style="${i.feito?'text-decoration:line-through;opacity:.6':''}">${i.kind==='ev'?'◆ ':''}${esc(i.titulo)}${i.kind==='ev'&&i.e.local?`<small class="muted" style="display:block">${esc(i.e.local)}</small>`:''}</span></button>`;}).join('')}</div>`:'<div class="empty">Nada neste dia.</div>'}

      </section>
    </aside>
  </div>`;
  const mv=n=>{ if(A.modo==='mes') A.ref=fmt(new Date(Date.UTC(y,mo+n,1))); else if(A.modo==='semana') A.ref=addDias(A.ref,7*n); render(); };
  $('#ag-prev').onclick=()=>mv(-1); $('#ag-next').onclick=()=>mv(1);
  $('#ag-hoje').onclick=()=>{ A.ref=S.hoje; A.sel=S.hoje; render(); };
  m.querySelectorAll('[data-modo]').forEach(b=>b.onclick=()=>{ A.modo=b.dataset.modo; render(); });
  m.querySelectorAll('.day').forEach(b=>b.onclick=()=>{ A.sel=b.dataset.d; render(); });
  m.querySelectorAll('[data-chip]').forEach(b=>b.onclick=()=>abrirChip(REG[b.dataset.chip]));
  m.querySelectorAll('[data-sel]').forEach(b=>b.onclick=()=>abrirChip(REG[b.dataset.sel]));
  $('#ag-ne').onclick=()=>formEvento(null,A.sel); $('#ag-adde').onclick=()=>formEvento(null,A.sel);
  $('#ag-nt').onclick=()=>novaTarefa(S.hoje); $('#ag-add').onclick=()=>novaTarefa(A.sel);
  $('#ag-na').onclick=()=>formAniv(null);
  if(A.modo==='lista'){ $('#ag-prev').disabled=true; $('#ag-next').disabled=true; }
}

function partesReflexao(txt){
  txt=String(txt||'').replace(/\r/g,'');
  let leitura=''; const k=txt.search(/Leitura Anual da B[íi]blia/i);
  let corpo=txt;
  if(k>=0){ leitura=txt.slice(k).replace(/^Leitura Anual da B[íi]blia\s*/i,'').replace(/\n\s*\n/g,'\n').trim(); corpo=txt.slice(0,k); }
  const blocos=corpo.split(/\n\s*\n/).map(s=>s.trim()).filter(Boolean);
  const paras=[]; let tema='';
  blocos.forEach((b,i)=>{
    const rot=b.match(/^(\p{Extended_Pictographic}️?\s*)?([A-ZÀ-Ú][\p{L} ]{1,24}):\s*$/u);
    if(rot){ paras.push({tipo:'lbl',txt:rot[2]}); return; }
    if(i===0&&b.length<70&&!/[.!?]$/.test(b)&&!b.includes('\n')){ tema=b; return; }
    const inl=b.match(/^(Ilustração|Reflexão|Conclusão|Explicação|Aplicação):\s*(.+)$/s);
    if(inl){ paras.push({tipo:'lbl',txt:inl[1]}); paras.push({tipo:'p',txt:inl[2]}); return; }
    paras.push({tipo:'p',txt:b});
  });
  return {tema,paras,leitura};
}
async function carregarDevocional(d){

    let [dev,notas]=await Promise.all([db.getDevocional(d),db.getAnotacoes(d)]);
    let origem=null;
    // Calendário anual: se não há devocional para esta data, usa o mesmo dia e mês de um ano anterior (o mais recente)
    if(!dev&&d.slice(5)!=='02-29'){
      const y=+d.slice(0,4), cands=[]; for(let k=1;k<=6;k++) cands.push(`${y-k}${d.slice(4)}`);
      const achados=await db.devocionaisEm(cands).catch(()=>[]);
      if(achados.length){ dev=achados.sort((a,b)=>a.data<b.data?1:-1)[0]; origem=dev.data.slice(0,4); }
    }
    if(S.dv.data!==d) return;
    S.dv.dev=dev; S.dv.origem=origem; S.dv.notas={}; (notas||[]).forEach(n=>S.dv.notas[n.tipo]=n.texto||'');

const ALIAS_DEV={data:['data','date'],dia:['dia','day'],mes:['mes','month'],ano:['ano','year'],titulo:['titulo','title','tema'],
  texto_biblico:['texto_biblico','bible_text','texto','versiculo','versiculo_do_dia'],referencia:['referencia','reference','ref'],
  reflexao:['reflexao','reflection','mensagem','devocional'],aplicacao:['aplicacao','application','aplicacao_pratica'],oracao:['oracao','prayer'],
  palavras_chave:['palavras_chave','keywords','tags','palavras'],id:['id']};
function chaveNorm(k){ return String(k).normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().trim().replace(/[\s\-]+/g,'_'); }
function canonDev(obj){ const o={}; for(const [k,v] of Object.entries(obj)){ const n=chaveNorm(k); for(const [c,al] of Object.entries(ALIAS_DEV)) if(al.includes(n)&&o[c]==null) o[c]=v; } return o; }
function dataValida(s){ if(!/^\d{4}-\d{2}-\d{2}$/.test(s)) return false; const x=parse(s); return fmt(x)===s; }
function linhaDev(o){
  let data='';
  const dd=String(o.data??'').trim();
  if(/^\d{4}-\d{2}-\d{2}/.test(dd)) data=dd.slice(0,10);
  else if(/^\d{1,2}\/\d{1,2}\/\d{4}$/.test(dd)){ const [a,b,c]=dd.split('/'); data=`${c}-${b.padStart(2,'0')}-${a.padStart(2,'0')}`; }
  else if(/^\d{1,2}\/\d{1,2}$/.test(dd)&&o.ano){ const [a,b]=dd.split('/'); data=`${o.ano}-${b.padStart(2,'0')}-${a.padStart(2,'0')}`; }
  else if(o.ano&&o.mes&&o.dia) data=`${o.ano}-${String(o.mes).padStart(2,'0')}-${String(o.dia).padStart(2,'0')}`;
  if(!dataValida(data)) throw new Error('data ausente ou inválida');
  const titulo=String(o.titulo??'').trim(); if(!titulo) throw new Error('sem título');
  let kw=o.palavras_chave; if(!Array.isArray(kw)) kw=String(kw||'').split(/[;|,]/).map(s=>s.trim()).filter(Boolean);
  const v=x=>x==null||x===''?null:String(x);
  return {id:o.id?String(o.id):('devocional-'+data),data,titulo,texto_biblico:v(o.texto_biblico),referencia:v(o.referencia),reflexao:v(o.reflexao),
    aplicacao:v(o.aplicacao),oracao:v(o.oracao),palavras_chave:kw};
}
function parseCSV(txt){
  txt=txt.replace(/^﻿/,'');
  const l1=txt.split(/\r?\n/)[0]||'';
  const sep=l1.includes('\t')?'\t':(l1.split(';').length>l1.split(',').length?';':',');
  const rows=[]; let row=[],f='',q=false;
  for(let i=0;i<txt.length;i++){ const c=txt[i];
    if(q){ if(c==='"'){ if(txt[i+1]==='"'){ f+='"'; i++; } else q=false; } else f+=c; }
    else if(c==='"') q=true;
    else if(c===sep){ row.push(f); f=''; }
    else if(c==='\n'||c==='\r'){ if(c==='\r'&&txt[i+1]==='\n') i++; row.push(f); rows.push(row); row=[]; f=''; }
    else f+=c; }
  if(f!==''||row.length){ row.push(f); rows.push(row); }
  const lim=rows.filter(r=>r.some(x=>String(x).trim()!==''));
  if(lim.length<2) throw new Error('o CSV precisa de uma linha de cabeçalho e pelo menos um devocional');
  const cab=lim[0]; return lim.slice(1).map(r=>{ const o={}; cab.forEach((h,i)=>o[h]=r[i]); return o; });
}

function importarDevocionais(){
  const m=abrirModal(`<h3>${ic('upload')} Importar devocionais</h3>
    <p class="small muted" style="margin-top:0">Arquivos <b>JSON</b> (o formato do seu devocional anual) ou <b>CSV</b> (planilha salva como CSV, com cabeçalho: <code>data; titulo; texto_biblico; referencia; reflexao; aplicacao; oracao; palavras_chave</code>). Os textos são gravados exatamente como estão. Nada é apagado. Arquivos DOCX ficam para uma etapa futura.</p>
    <div class="field"><input type="file" id="im-f" accept=".json,.csv,application/json,text/csv" multiple class="inp" style="padding:8px;height:auto" aria-label="Escolher arquivos"></div>

    <div class="progress hidden" id="im-p"><i></i></div>
    <div class="foot" style="flex-wrap:wrap"><button class="btn" id="im-bk" style="margin-right:auto">${ic('download')} Baixar backup dos devocionais</button><button class="btn" id="im-c">Fechar</button><button class="btn primary" id="im-go" disabled>${ic('upload')} Importar</button></div>`,{wide:true});
  let novos=[], existentes=[];
  const st=m.querySelector('#im-s'), go=m.querySelector('#im-go');
  m.querySelector('#im-c').onclick=fecharModal;
  m.querySelector('#im-bk').onclick=async()=>{ try{ await exportarDevocionais(); }catch(e){ erro(e,'Falha no backup'); } };
  const resumo=()=>{ const subst=m.querySelector('#im-sub'); const n=novos.length+(subst&&subst.checked?existentes.length:0);
    go.disabled=!n; go.innerHTML=`${ic('upload')} Importar ${n}`; icons(); };
  m.querySelector('#im-f').onchange=async e=>{
    novos=[]; existentes=[]; go.disabled=true; st.innerHTML='Lendo arquivos…';
    const erros=[], porData={}; let repetidos=0, lidos=0;
    for(const f of e.target.files){
      try{
        const txt=await f.text(); let itens;
        if(/\.csv$/i.test(f.name)||f.type==='text/csv') itens=parseCSV(txt);
        else { const j=JSON.parse(txt); itens=Array.isArray(j)?j:(j&&j.tabelas&&Array.isArray(j.tabelas.devocionais)?j.tabelas.devocionais:null); if(!itens) throw new Error('o JSON não contém uma lista de devocionais'); }
        itens.forEach((x,i)=>{ lidos++; try{ const r=linhaDev(canonDev(x||{})); if(porData[r.data]) repetidos++; porData[r.data]=r; }catch(err){ erros.push(`${f.name}, item ${i+1}: ${err.message}`); } });
      }catch(err){ erros.push(`${f.name}: ${err.message}`); }
    }
    const linhas=Object.values(porData).sort((a,b)=>a.data<b.data?-1:1);
    if(!linhas.length){ st.innerHTML=`<div class="im-err">Nenhum devocional válido encontrado.${erros.length?'<br>'+erros.slice(0,6).map(esc).join('<br>'):''}</div>`; return; }

function traduzErroIA(m,status){
  if(/credit|balance|billing/i.test(m)) return 'Os créditos da API da Anthropic parecem ter acabado. Confira o saldo no Console da Anthropic.';
  if(status===404||/not_found|model/i.test(m)&&/not.?found|invalid|does not exist/i.test(m)) return `O modelo "${modeloIA()}" não foi aceito pela API. Troque o modelo em Ajustes → Inteligência artificial.`;
  if(status===401||/api.?key|authentication/i.test(m)) return 'O Worker não conseguiu se autenticar na Anthropic (confira a chave ANTHROPIC_API_KEY no Worker).';
  if(status===429) return 'Muitas chamadas seguidas. Aguarde um minuto e tente de novo.';
  if(/overloaded/i.test(m)||status===529) return 'Os servidores da IA estão sobrecarregados agora. Tente de novo em alguns minutos.';
  return m;
}
async function chamarIA({tipo,pedido,max=8000,dataDev=null}){
  if(!navigator.onLine) throw new Error('Sem conexão com a internet. A IA depende de conexão.');
  const usadas=await db.contarDesde('ia_log','criado_em',new Date(Date.now()-864e5).toISOString()).catch(()=>0);
  if(usadas>=limiteIA()) throw new Error(`Limite de ${limiteIA()} chamadas à IA nas últimas 24 horas atingido. Se precisar, aumente em Ajustes → Inteligência artificial.`);
  const sis=sistemaIA();
  // As instruções vão também na mensagem do usuário: mesmo que o Worker troque o "system", o pedido chega completo.
  const corpo={model:modeloIA(),max_tokens:max,system:sis,messages:[{role:'user',content:`${sis}\n\n==================== PEDIDO ====================\n${pedido}`}]};
  let ultimo=null;
  for(let tentativa=0;tentativa<2;tentativa++){
    const ac=new AbortController(), t=setTimeout(()=>ac.abort(),240000);
    try{
      const r=await fetch(CONFIG.WORKER,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(corpo),signal:ac.signal});
      const raw=await r.text(); let j;
      try{ j=JSON.parse(raw); }catch(e){ const er=new Error(`Resposta inesperada do Worker (HTTP ${r.status}).`); er.repetir=r.status>=500; throw er; }
      if(!r.ok||j.error){ const msg=typeof j.error==='string'?j.error:(j.error&&j.error.message)||('HTTP '+r.status);
        const er=new Error(traduzErroIA(msg,r.status)); er.repetir=[500,502,503,529].includes(r.status)||/overloaded/i.test(msg); throw er; }
      const txt=(j.content||[]).filter(b=>b.type==='text').map(b=>b.text).join('\n').trim(), u=j.usage||{};
      db.ins('ia_log',{tipo,devocional_data:dataDev,modelo:j.model||corpo.model,tokens_entrada:u.input_tokens||null,tokens_saida:u.output_tokens||null,ok:!!txt,erro:txt?null:'sem texto: '+(j.stop_reason||'?')}).catch(()=>{});
      if(!txt){ const er=new Error(j.stop_reason==='max_tokens'?'A IA gastou todo o limite de resposta antes de escrever. Tente de novo.':'A IA respondeu sem texto. Tente de novo.'); er.logado=true; throw er; }
      return {texto:txt,parada:j.stop_reason};
    }catch(e){
      ultimo=e.name==='AbortError'?new Error('A IA demorou mais de 4 minutos para responder.'):(e instanceof TypeError?Object.assign(new Error('Não consegui falar com o Worker da IA (sem internet ou endereço bloqueado).'),{repetir:true}):e);
      if(!ultimo.repetir||tentativa===1) break;
      await new Promise(res=>setTimeout(res,4000));
    }finally{ clearTimeout(t); }
  }
  if(!ultimo.logado) db.ins('ia_log',{tipo,devocional_data:dataDev,modelo:corpo.model,ok:false,erro:String(ultimo.message).slice(0,500)}).catch(()=>{});
  throw ultimo;
}

function mdInline(s){
  return esc(s).replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>').replace(/(^|[^*])\*([^*\s][^*]*)\*/g,'$1<em>$2</em>');
}
function mdBlocos(md){
  const L=String(md||'').replace(/\r/g,'').split('\n'), B=[]; let p=[];
  const flush=()=>{ if(p.length){ B.push({t:'p',txt:p.join(' ')}); p=[]; } };
  for(let i=0;i<L.length;i++){
    const s=L[i].trim(); let m;
    if(!s){ flush(); continue; }
    if((m=s.match(/^(#{1,4})\s+(.*)$/))){ flush(); B.push({t:'h',n:m[1].length,txt:m[2]}); continue; }
    if(/^(-{3,}|\*{3,}|_{3,})$/.test(s)){ flush(); B.push({t:'hr'}); continue; }
    if(s.startsWith('>')){ flush(); const q=[s.replace(/^>\s?/,'')]; while(i+1<L.length&&L[i+1].trim().startsWith('>')) q.push(L[++i].trim().replace(/^>\s?/,'')); B.push({t:'q',txt:q.join(' ')}); continue; }
    if((m=s.match(/^[-*•]\s+(.*)$/))){ flush(); const it=[m[1]]; while(i+1<L.length&&/^\s*[-*•]\s+/.test(L[i+1])) it.push(L[++i].trim().replace(/^[-*•]\s+/,'')); B.push({t:'ul',itens:it}); continue; }
    if((m=s.match(/^\d+[.)]\s+(.*)$/))){ flush(); const it=[m[1]]; while(i+1<L.length&&/^\s*\d+[.)]\s+/.test(L[i+1])) it.push(L[++i].trim().replace(/^\d+[.)]\s+/,'')); B.push({t:'ol',itens:it}); continue; }
    p.push(s);
  }
  flush(); return B;
}
function mdHTML(md){
  return mdBlocos(md).map(b=>b.t==='h'?`<h${b.n+1}>${mdInline(b.txt)}</h${b.n+1}>`:b.t==='hr'?'<hr>':b.t==='q'?`<blockquote>${mdInline(b.txt)}</blockquote>`
    :b.t==='ul'?`<ul>${b.itens.map(x=>`<li>${mdInline(x)}</li>`).join('')}</ul>`:b.t==='ol'?`<ol>${b.itens.map(x=>`<li>${mdInline(x)}</li>`).join('')}</ol>`:`<p>${mdInline(b.txt)}</p>`).join('');
}
/* Nome de arquivo a partir do tema: preserva acentos, remove caracteres proibidos no Windows/Mac, limita o tamanho */
function nomeArquivo(nome,ext,padrao='Documento VidaPlena'){
  let n=String(nome||'').normalize('NFC').replace(/[\u0000-\u001f<>:"/\\|?*]+/g,' ').replace(/\s+/g,' ').trim().replace(/[. ]+$/,'').replace(/^[. ]+/,'');
  if(!n) n=padrao;
  if(/^(con|prn|aux|nul|com\d|lpt\d)$/i.test(n)) n='_'+n;
  if(n.length>120){ const c=n.slice(0,120); n=(c.replace(/\s+\S*$/,'')||c).trim(); }
  return `${n}.${ext}`;
}
function carregarScript(src,global){
  if(window[global]) return Promise.resolve(window[global]);
  return new Promise((ok,no)=>{ const s=document.createElement('script'); s.src=src; s.onload=()=>window[global]?ok(window[global]):no(new Error('biblioteca não carregou')); s.onerror=()=>no(new Error('sem conexão para carregar o gerador de DOCX')); document.head.appendChild(s); });
}
async function exportarDocx(item,md){
  const D=await carregarScript('https://cdn.jsdelivr.net/npm/docx@9.5.1/dist/index.iife.js','docx');
  const runs=(txt,base={})=>{ const out=[], re=/(\*\*[^*]+\*\*|\*[^*\s][^*]*\*)/g; let last=0,m;
    while((m=re.exec(txt))){ if(m.index>last) out.push(new D.TextRun({text:txt.slice(last,m.index),...base}));
      const tk=m[0]; out.push(tk.startsWith('**')?new D.TextRun({text:tk.slice(2,-2),bold:true,...base}):new D.TextRun({text:tk.slice(1,-1),italics:true,...base})); last=m.index+tk.length; }
    if(last<txt.length) out.push(new D.TextRun({text:txt.slice(last),...base})); return out; };
  const H=[D.HeadingLevel.TITLE,D.HeadingLevel.HEADING_1,D.HeadingLevel.HEADING_2,D.HeadingLevel.HEADING_3];
  const filhos=[];
  for(const b of mdBlocos(md)){
    if(b.t==='h') filhos.push(new D.Paragraph({heading:H[Math.min(b.n,4)-1],children:runs(b.txt),spacing:{before:240,after:120}}));
    else if(b.t==='hr') filhos.push(new D.Paragraph({thematicBreak:true,children:[]}));
    else if(b.t==='q') filhos.push(new D.Paragraph({children:runs(b.txt,{italics:true}),indent:{left:567},spacing:{after:160}}));
    else if(b.t==='ul') b.itens.forEach(x=>filhos.push(new D.Paragraph({bullet:{level:0},children:runs(x),spacing:{after:80}})));
    else if(b.t==='ol') b.itens.forEach((x,i)=>filhos.push(new D.Paragraph({children:[new D.TextRun({text:`${i+1}. `,bold:true}),...runs(x)],indent:{left:360},spacing:{after:80}})));
    else filhos.push(new D.Paragraph({children:runs(b.txt),spacing:{after:160,line:300},alignment:D.AlignmentType.JUSTIFIED}));
  }
  const doc=new D.Document({creator:'VidaPlena',title:item.tema||item.titulo,description:item.tipo==='sermao'?'Sermão':'Estudo de célula',
    styles:{default:{document:{run:{font:'Calibri',size:24}}}},sections:[{children:filhos}]});
  const blob=await D.Packer.toBlob(doc);
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=nomeArquivo(item.tema||item.titulo,'docx',item.tipo==='sermao'?'Sermão':'Estudo de célula');
  document.body.appendChild(a); a.click(); setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); },800);
}

      :`<div class="empty">${S.bib.length?'Nada encontrado com esses filtros.':'A biblioteca está vazia. Gere uma sugestão em Sugestões e ela é salva aqui automaticamente.'}</div>`}

const TABELAS_BACKUP=[['config','id'],['tarefas','id'],['tarefa_ocorrencias','tarefa_id,data'],['eventos','id'],['aniversarios','id'],['datas_importantes','id'],
  ['anotacoes','data,tipo'],['notificacoes_lidas','chave'],['devocional_leituras','data'],['biblioteca','id'],['devocionais','data']];
function baixar(nome,texto,tipo='application/json'){ const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([texto],{type:tipo})); a.download=nome; document.body.appendChild(a); a.click(); setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); },500); }
async function exportarBackup(comDev){
  const tab={}, falhas=[];
  for(const [t] of TABELAS_BACKUP){ if(t==='devocionais'&&!comDev) continue; try{ tab[t]=await db.list(t); }catch(e){ falhas.push(t); } }
  if(tab.config) tab.config=tab.config.map(c=>({...c,pin_hash:undefined}));
  const pacote={app:'VidaPlena',versao:CONFIG.VERSAO,exportado_em:new Date().toISOString(),tabelas:tab};
  baixar(`vidaplena-backup-${S.hoje}.json`,JSON.stringify(pacote,null,1));
  toast(`Backup gerado (${Object.values(tab).reduce((s,r)=>s+r.length,0)} registros)`+(falhas.length?` — sem: ${falhas.join(', ')}`:''),!!falhas.length);
}
function importarBackup(){
  const m=abrirModal(`<h3>${ic('archive-restore')} Restaurar backup</h3>
    <p class="small muted">Escolha um arquivo gerado pelo VidaPlena. A restauração <b>acrescenta e atualiza</b> registros com o mesmo identificador; nada que existe hoje é apagado. O PIN não é alterado.</p>
    <div class="field"><input type="file" id="rb-f" accept=".json,application/json" class="inp" style="padding:8px;height:auto"></div>
    <div id="rb-s" class="small"></div><div class="progress hidden" id="rb-p"><i></i></div>
    <div class="foot"><button class="btn" id="rb-c">Fechar</button><button class="btn primary" id="rb-go" disabled>${ic('archive-restore')} Restaurar</button></div>`,{wide:true});
  let pac=null; const st=m.querySelector('#rb-s'), go=m.querySelector('#rb-go');
  m.querySelector('#rb-c').onclick=fecharModal;
  m.querySelector('#rb-f').onchange=async e=>{
    pac=null; go.disabled=true;
    try{ const j=JSON.parse(await e.target.files[0].text());
      if(j.app!=='VidaPlena'||!j.tabelas||typeof j.tabelas!=='object') throw new Error('não é um backup do VidaPlena');
      const conhecidas=TABELAS_BACKUP.map(x=>x[0]), linhas=Object.entries(j.tabelas).filter(([t,r])=>conhecidas.includes(t)&&Array.isArray(r));
      if(!linhas.length) throw new Error('nenhuma tabela reconhecida');
      pac=j;
      st.innerHTML=`Backup de <b>${new Date(j.exportado_em).toLocaleString('pt-BR')}</b> (versão ${esc(j.versao)}):<ul style="margin:6px 0">${linhas.map(([t,r])=>`<li>${t}: ${r.length} registro(s)</li>`).join('')}</ul>Confira antes de restaurar.`;
      go.disabled=false;
    }catch(err){ st.innerHTML=`<span style="color:var(--bad)">Arquivo inválido: ${esc(err.message)}</span>`; }
  };
  go.onclick=async()=>{
    if(!await confirmarInline()) return;
    go.disabled=true; const p=m.querySelector('#rb-p'); p.classList.remove('hidden'); const bar=p.firstElementChild;
    const ordem=TABELAS_BACKUP.filter(([t])=>Array.isArray(pac.tabelas[t]));
    let i=0;
    try{
      for(const [t,conf] of ordem){ let rows=pac.tabelas[t]; if(t==='config') rows=rows.map(({pin_hash,...r})=>r);
        for(let k=0;k<rows.length;k+=200) await db.upsertRows(t,rows.slice(k,k+200),conf);
        bar.style.width=(++i/ordem.length*100)+'%'; st.innerHTML=`Restaurando... ${t}`; }
      st.innerHTML='<span style="color:var(--ok);font-weight:600">Backup restaurado.</span>'; toast('Backup restaurado');
      S.cfg=await db.getConfig(); await recarregar(true); setTimeout(()=>{ fecharModal(); render(); },900);
    }catch(e){ erro(e,'A restauração parou'); go.disabled=false; }
  };
  function confirmarInline(){ return Promise.resolve(window.confirm('Restaurar este backup? Registros com o mesmo identificador serão atualizados com o conteúdo do arquivo.')); }
}
async function buscarCidade(nome){
  const j=await fetchJSON(`https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(nome)}&count=6&language=pt&format=json`);
  return (j.results||[]).map(r=>({nome:r.name,uf:r.admin1||'',pais:r.country||'',lat:r.latitude,lon:r.longitude}));
}

  // Recalcula quando o dia muda no fuso configurado, mesmo com a aba aberta, e quando a aba volta ao foco
  setInterval(verificarDia,60000);
  // Clima e dólar: consulta no início e a cada 15 min (o cache evita chamadas desnecessárias)
  atualizarClima(); atualizarDolar();
  setInterval(()=>{ atualizarClima(); atualizarDolar(); },15*60*1000);
  window.addEventListener('online',()=>{ atualizarClima(); atualizarDolar(); });
  document.addEventListener('visibilitychange',()=>{ if(!document.hidden) verificarDia(); });
}
/* Atualização do app: avisa quando uma versão nova foi instalada, sem recarregar sozinho (não perde o que está sendo digitado) */
if('serviceWorker' in navigator && location.protocol==='https:'){
  const tinha=!!navigator.serviceWorker.controller;
  navigator.serviceWorker.register('sw.js').then(r=>{ setInterval(()=>r.update().catch(()=>{}),30*60*1000); }).catch(()=>{});
  navigator.serviceWorker.addEventListener('controllerchange',()=>{ if(tinha) toast('Há uma nova versão do VidaPlena.',false,{label:'Atualizar agora',run:()=>location.reload()}); });
}
iniciar();
</script>
